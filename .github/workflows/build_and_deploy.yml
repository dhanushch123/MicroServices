name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # in git hub we can trigger the workflow manually

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: kubernetes-cluster
  GKE_ZONE: asia-south1

jobs:
  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - config-server
          - inventory-service
          - order-service
# like a for loop we want to build images for each service
# Perform steps parallely for services
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker images using Jib for each service
      - name: Build and Push ${{ matrix.service }}
        working-directory: ${{ matrix.service }}/${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

    # We built images

  Deploy:
    needs: Build # wait until build job is finished
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GK_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Apply manifests and restart deployments
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/config-server
          kubectl rollout status deployment/config-server --timeout=300s
          kubectl rollout restart deployment/api-gateway deployment/inventory-service deployment/order-service
          kubectl rollout status deployment/api-gateway --timeout=300s
          kubectl rollout status deployment/inventory-service --timeout=300s
          kubectl rollout status deployment/order-service --timeout=300s