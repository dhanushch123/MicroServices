apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  annotations:
    cloud.google.com/backend-config: '{"default":"zipkin-backend-config"}'
spec:
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin
        resources:
          limits:
              memory: "400Mi"
              cpu: "100m"
          requests:
            memory: "200Mi"
            cpu: "50m"
        ports:
        - containerPort: 9411
        readinessProbe:
          tcpSocket:
            port: 9411
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector:
    app: zipkin
  ports:
  - port: 9411
    targetPort: 9411

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: zipkin-backend-config
spec:
  healthCheck:
    type: HTTP
    port: 9411
    requestPath: /
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
