apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: dhanushch3/ecommerce-order-service:latest
        resources:
          limits:
            memory: "400Mi"
            cpu: "200m"
          requests:
            memory: "200Mi"
            cpu: "100m"
        env:
          - name: CONFIG_SERVER_URL
            value: http://config-server:8888
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: ORDER_DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: ORDER_DB_PASSWORD
        ports:
        - containerPort: 9020
        readinessProbe:
          httpGet:
            path: /orders/actuator/health
            port: 9020
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - port: 80
    targetPort: 9020
