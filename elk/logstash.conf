input {
  file {
    path => ["/logs/*/*.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/logstash-sincedb"
    ecs_compatibility => "disabled"

    codec => multiline {
      pattern => "^\d{2}-\d{2}-\d{4} "
      negate => true
      what => "previous"
      auto_flush_interval => 2
    }
  }
}

filter {
  grok {
    match => {
      "message" => "^(?<log_timestamp>\d{2}-\d{2}-\d{4} \d{2}:\d{2}:\d{2}\.\d{3}) \[%{DATA:thread}\] \[%{DATA:trace_context}\] %{LOGLEVEL:level}\s+%{GREEDYDATA:log_message}$"
    }
  }

  date {
    match => ["log_timestamp", "dd-MM-yyyy HH:mm:ss.SSS"]
    timezone => "Asia/Kolkata"
    target => "@timestamp"
  }

  grok {
    match => {
      "path" => "^/logs/(?<service>[^/]+)/"
    }
  }

  mutate {
    remove_field => ["log_timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "spring-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}