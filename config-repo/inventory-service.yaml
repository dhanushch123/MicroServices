server:
  port: 9010
  servlet:
    context-path: /inventory

spring:
  datasource:
    url: jdbc:postgresql://inventory-db:5432/inventoryDB
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

services:
  order-service:
    url: http://order-service:9020
