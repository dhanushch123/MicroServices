services:
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderDB
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventoryDB
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      args:
        SERVICE_DIR: discovery-service/discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  config-server:
    build:
      context: .
      args:
        SERVICE_DIR: config-server/config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      args:
        SERVICE_DIR: inventory-service/inventory-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "9010:9010"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9010'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: .
      args:
        SERVICE_DIR: order-service/order-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      order-db:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "9020:9020"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9020'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        SERVICE_DIR: api-gateway/api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-key-change-before-deploy}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  order-db-data:
  inventory-db-data:
